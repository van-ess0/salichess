#
# Builds the RPMs for the phone and emulator architectures with the Sailfish
# OS Platform SDK in Docker, using https://github.com/CODeRUS/github-sfos-build
# (its "sfos5" branch handles target releases 5.0 and newer).
#
# Pushing a tag vX.Y-Z also publishes a GitHub release with the RPMs. The spec
# is the source of the version: bump Version/Release and the changelog in
# rpm/, commit, then tag. A tag that doesn't match the spec fails the build.

name: Build RPMs

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

env:
  # Sailfish OS target release, same as the SDK target used for development.
  # Available releases: https://hub.docker.com/r/coderus/sailfishos-platform-sdk/tags
  RELEASE: 5.1.0.11

# A newer push to the same branch or pull request replaces a running build.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Before the long build: a release tag must name the spec's version.
      - name: Check release tag against the spec
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^Version:[[:space:]]*//p' rpm/harbour-salichess.spec)
          release=$(sed -n 's/^Release:[[:space:]]*//p' rpm/harbour-salichess.spec)
          if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)+-[0-9]+$ ]]; then
            echo "::error::Release tags look like vX.Y-Z (e.g. v0.2-1), got $TAG"
            exit 1
          fi
          if [ "$TAG" != "v$version-$release" ]; then
            echo "::error::Tag $TAG does not match the spec (Version $version, Release $release): expected v$version-$release"
            exit 1
          fi
          if ! grep -q "^\* .* $version-$release\$" rpm/harbour-salichess.changes; then
            echo "::error::rpm/harbour-salichess.changes has no entry for $version-$release"
            exit 1
          fi

      # One job builds all architectures, so the ~5 GB SDK image is pulled once.
      # The third-party action is pinned to a commit of its sfos5 branch.
      - name: Build aarch64
        uses: coderus/github-sfos-build@67702884a1b192d1dfdb2fc5ec6e908e9e274855 # sfos5
        with:
          release: ${{ env.RELEASE }}
          arch: aarch64

      - name: Build armv7hl
        uses: coderus/github-sfos-build@67702884a1b192d1dfdb2fc5ec6e908e9e274855 # sfos5
        with:
          release: ${{ env.RELEASE }}
          arch: armv7hl

      - name: Build i486 (emulator)
        uses: coderus/github-sfos-build@67702884a1b192d1dfdb2fc5ec6e908e9e274855 # sfos5
        with:
          release: ${{ env.RELEASE }}
          arch: i486

      - name: Upload RPMs
        uses: actions/upload-artifact@v7
        with:
          name: harbour-salichess-rpms
          path: RPMS/*.rpm
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download RPMs
        uses: actions/download-artifact@v8
        with:
          name: harbour-salichess-rpms
          path: RPMS

      # The notes are this version's entry from the RPM changelog.
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Header lines end in " <version>-<release>"; print the one entry.
          awk -v ver="${TAG#v}" '
            /^\* / { if (found) exit; found = substr($0, length($0) - length(ver)) == " " ver; next }
            found && NF { print }
          ' rpm/harbour-salichess.changes > notes.md
          echo "" >> notes.md
          echo "RPMs for Sailfish OS ${{ env.RELEASE }} and newer: aarch64 and armv7hl for phones, i486 for the SDK emulator." >> notes.md
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" RPMS/*.rpm --verify-tag --title "salichess ${TAG#v}" --notes-file notes.md
