# SPDX-FileCopyrightText: 2026 van-ess0 <https://github.com/van-ess0>
# SPDX-License-Identifier: GPL-3.0-or-later
#
# Licensing of files that cannot carry a header (https://reuse.software).
# Check with: uvx reuse lint

version = 1
SPDX-PackageName = "salichess"
SPDX-PackageSupplier = "van-ess0 <https://github.com/van-ess0>"
SPDX-PackageDownloadLocation = "https://github.com/van-ess0/salichess"

[[annotations]]
path = ["translations/*.ts", ".gitattributes", "README.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 van-ess0 <https://github.com/van-ess0>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The launcher icon: the cburnett knight on the base shape of the
# Sailfish OS app icon template.
[[annotations]]
path = ["icons/harbour-salichess.svg", "icons/*/harbour-salichess.png"]
precedence = "override"
SPDX-FileCopyrightText = [
    "2026 van-ess0 <https://github.com/van-ess0>",
    "Colin M.L. Burnett",
    "Jolla Ltd.",
]
SPDX-License-Identifier = "GPL-2.0-or-later AND CC-BY-3.0"

# Chess pieces, as distributed with Lichess (lichess-org/lila, public/piece/cburnett).
[[annotations]]
path = "qml/images/pieces/cburnett/*.svg"
precedence = "override"
SPDX-FileCopyrightText = "Colin M.L. Burnett"
SPDX-License-Identifier = "GPL-2.0-or-later"

# Vendored rules engine: https://github.com/Disservin/chess-library
[[annotations]]
path = "3rdparty/chess-library/**"
precedence = "override"
SPDX-FileCopyrightText = "2023 disservin"
SPDX-License-Identifier = "MIT"

# Vendored engine: https://github.com/official-stockfish/Stockfish (tag sf_17.1),
# without its main.cpp and Makefile. Its own files carry the licence in words
# but not as an SPDX tag.
[[annotations]]
path = "3rdparty/stockfish/**"
precedence = "override"
SPDX-FileCopyrightText = "2004-2025 The Stockfish developers (see 3rdparty/stockfish/AUTHORS)"
SPDX-License-Identifier = "GPL-3.0-or-later"

# incbin, which Stockfish uses to build a network into the binary. salichess
# downloads the networks instead, so nothing of it is compiled in, but the
# header comes with the engine.
[[annotations]]
path = "3rdparty/stockfish/incbin/**"
precedence = "override"
SPDX-FileCopyrightText = "Dale Weiler"
SPDX-License-Identifier = "Unlicense"
